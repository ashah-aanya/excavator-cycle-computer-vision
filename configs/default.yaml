# Every tunable value in the pipeline.
#
# This file mirrors src/excavator_cycles/config.py. Anything omitted here keeps
# the default from that file; anything set here overrides it. Pass with
# `--config configs/default.yaml`.
#
# Three rules govern what may appear in this file:
#   1. Times in SECONDS, never frames.
#   2. Distances as fractions of the machine's reach, never pixels.
#   3. Signal thresholds as multipliers of a per-video percentile, never levels.
# A value that violates these would be tuned to one video, which the task bans.
#
# `null` means "derive this from the data" -- a deliberate absence, not an
# unfilled blank.

sampling:
  rate_hz: 10.0            # features + state machine
  anchor_rate_hz: 1.0      # detector re-anchoring
  inference_max_edge: 1024 # longest side fed to the models; null = native

detection:
  excavator_prompts: ["excavator."]   # "digger." also works but also fires on trucks; see docs/stages/01-perception-findings.md
  truck_prompts: ["dump truck.", "truck."]
  model_id: "IDEA-Research/grounding-dino-base"
  revision: null           # pin to a commit SHA once the spike confirms the model
  box_threshold: 0.35
  text_threshold: 0.25
  alt_model_id: "google/owlv2-base-patch16-ensemble"


track:
  model_id: "facebook/sam2.1-hiera-tiny"   # ungated, Apache-2.0
  max_clean_truck_iou: 0.30   # above this, the detector merged the two machines
  negative_rows: 2            # "not this" points placed inside the truck box
  negative_columns: 3
  negative_y_low: 0.55        # low in the box: the bucket empties into the bed,
  negative_y_high: 0.90       #   so the upper region is where the bucket goes
  negative_x_margin: 0.15
  min_component_fraction: 0.05  # drop mask specks below this share of the mask
  max_area_ratio: 1.8         # mask this far above the video's median = absorbed something
  min_area_ratio: 0.4         # this far below = lost the machine
  max_bad_area_fraction: 0.10
  bucket_prompt: "mask"            # mask | points | box; SAM 2 prices them 77.6 / 75.4 / 72.9 J&F
  bucket_min_component_fraction: 0.01  # the bucket mask is ~8x smaller, so 0.05 would cut real fragments
  bucket_point_count: 5            # positives, when bucket_prompt is "points"
  bucket_negative_count: 3         # negatives on the stick, so SAM does not claim the arm

geometry:
  occupancy_quantile: 0.90   # what counts as the machine's persistent core
  reach_percentile: 95.0     # defines L, the scale unit
  bucket_band_low: 0.85      # bucket = outer 15% of the arm's radial extent
  bucket_radius_frac: 0.22   # optical-flow patch size, in units of L
  tip_process_noise: 2.0       # L/s^2  -- how much the bucket may accelerate
  tip_measurement_noise: 0.02  # L      -- expected error of one pose fit
  tip_gate_sigma: 3.0          # reject measurements beyond this many sigmas
  dwell_speed_quantile: 0.25 # "slow enough to count as lingering"
  min_zone_separation: 0.40  # dig and dump must be this far apart, in units of L

features:
  derivative_window_seconds: 0.9 # Savitzky-Golay; symmetric, so it moves no extremum
  smoothing_polyorder: 2
  box_window_seconds: 0.5        # 0.3 and 0.5 both give 4/4; 0.9 collapses to 1/4
  box_alignment: trailing        # trailing | centred | leading (the diagram draws leading)
  min_sample_confidence: 0.35    # below this, a sample is MISSING, not negative

fsm:
  hold_seconds: 0.40             # same for all four transitions, so lag is common-mode
  max_evidence_gap_seconds: 0.30
  max_lookback_seconds: 2.0      # how far pass 2 searches back for the true onset
  alpha_contact_speed: 0.35      # T1  swinging -> digging
  alpha_clearance_margin: 0.05   # T2  digging  -> hauling
  alpha_uncurl_rate: 0.50        # T3  hauling  -> dumping
  alpha_swing_rate: 0.40         # T4  dumping  -> swinging
  min_phase_seconds: null        # derived from this video; flags, never blocks

cycles:
  duration_band: [0.4, 2.5]      # relative to the median cycle in the same video
  min_mean_confidence: 0.50

qa:
  min_excavator_coverage: 0.97
  min_anchor_agreement: 0.70
  min_bucket_coverage: 0.90      # advisory only: reported, never folded into status
  min_bucket_containment: 0.80   # bucket pixels that must lie inside the machine's mask
  max_bucket_area_ratio: 4.0     # p90/p10 of bucket area across the clip
