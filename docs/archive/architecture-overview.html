<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excavator Pipeline Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      min-height: 100vh;
      padding: 2rem;
      color: white;
    }
    
    .container {
      max-width: 1300px;
      margin: 0 auto;
    }
    
    .header {
      margin-bottom: 2rem;
    }
    
    .header-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }
    
    .pulse-dot {
      width: 12px;
      height: 12px;
      background: #22d3ee;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    
    .subtitle {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-left: 1.75rem;
    }
    
    .diagram-container {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 1rem;
      border: 1px solid #1e293b;
      padding: 1.5rem;
      overflow-x: auto;
    }
    
    svg {
      width: 100%;
      min-width: 900px;
      display: block;
    }
    
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }
    
    .card {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 0.75rem;
      border: 1px solid #1e293b;
      padding: 1.25rem;
    }
    
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    
    .card-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    
    .card-dot.cyan { background: #22d3ee; }
    .card-dot.emerald { background: #34d399; }
    .card-dot.violet { background: #a78bfa; }
    .card-dot.amber { background: #fbbf24; }
    .card-dot.rose { background: #fb7185; }
    
    .card h3 {
      font-size: 0.875rem;
      font-weight: 600;
    }
    
    .card ul {
      list-style: none;
      color: #94a3b8;
      font-size: 0.75rem;
    }
    
    .card li {
      margin-bottom: 0.375rem;
    }
    
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #475569;
      font-size: 0.75rem;
    }

    .toolbar {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
      flex-shrink: 0;
      align-items: center;
    }
    .toolbar-toggle {
      background: transparent;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      transition: color 0.2s, background 0.2s;
    }
    .toolbar-toggle:hover { color: #94a3b8; background: rgba(30, 41, 59, 0.5); }
    .toolbar-actions {
      display: none;
      gap: 0.5rem;
    }
    .toolbar.expanded .toolbar-actions { display: flex; }
    .toolbar-actions button {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .toolbar-actions button:hover {
      background: rgba(51, 65, 85, 0.8);
      color: white;
      border-color: #475569;
    }

    @media print {
      body { background: #020617; padding: 1rem; }
      .toolbar { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="container" id="report-container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Excavator Cycle Pipeline</h1>
        <div class="toolbar">
          <div class="toolbar-actions">
            <button onclick="copyAsImage(this)">📋 Copy</button>
            <button onclick="downloadPNG(this)">🖼️ PNG</button>
            <button onclick="downloadPDF(this)">📄 PDF</button>
          </div>
          <button class="toolbar-toggle" onclick="this.parentElement.classList.toggle('expanded')" title="Export options" aria-label="Export options">⋯</button>
        </div>
      </div>
      <p class="subtitle">Zero-shot detection + video segmentation → box kinematics → rule-based two-pass phase state machine → cycle averages</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1290 470">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
          </marker>
          <marker id="arrowrose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- arrows (behind) -->
        <line x1="120" y1="190" x2="158" y2="190" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowhead)"/>
        <text x="139" y="183" fill="#cbd5e1" font-size="7" text-anchor="middle">frames</text>
        <line x1="340" y1="190" x2="378" y2="190" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowhead)"/>
        <text x="359" y="183" fill="#cbd5e1" font-size="7" text-anchor="middle">boxes</text>
        <line x1="580" y1="190" x2="618" y2="190" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowhead)"/>
        <text x="600" y="326" fill="#cbd5e1" font-size="8" text-anchor="middle">↑ masks (masks.npz)</text>
        <line x1="810" y1="190" x2="848" y2="190" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowhead)"/>
        <text x="829" y="183" fill="#cbd5e1" font-size="7" text-anchor="middle">signals</text>

        <text x="1069" y="183" fill="#cbd5e1" font-size="7" text-anchor="middle">onsets</text>
        <line x1="1175" y1="300" x2="1175" y2="338" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowhead)"/>
        <path d="M 1110 405 L 1060 405" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowrose)"/>

        <!-- boundaries -->
        <rect x="148" y="55" width="444" height="255" rx="12" fill="rgba(251, 191, 36, 0.05)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="160" y="73" fill="#fbbf24" font-size="10" font-weight="600">PERCEPTION · GPU (NCSA) · once per video · cached</text>
        <rect x="608" y="55" width="664" height="255" rx="12" fill="rgba(52, 211, 153, 0.04)" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="620" y="73" fill="#34d399" font-size="10" font-weight="600">MEASUREMENT + DECISIONS · CPU · seconds · re-runnable from the cache</text>

        <!-- input -->
        <rect x="20" y="150" width="100" height="80" rx="6" fill="#0f172a"/>
        <rect x="20" y="150" width="100" height="80" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="70" y="178" fill="white" font-size="12" font-weight="600" text-anchor="middle">Video</text>
        <text x="70" y="195" fill="#94a3b8" font-size="8" text-anchor="middle">static camera</text>
        <text x="70" y="208" fill="#94a3b8" font-size="8" text-anchor="middle">file timestamps</text>

        <!-- Grounding DINO -->
        <rect x="160" y="90" width="180" height="205" rx="6" fill="#0f172a"/>
        <rect x="160" y="90" width="180" height="205" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="250" y="112" fill="white" font-size="12" font-weight="700" text-anchor="middle">Grounding DINO</text>
        <text x="250" y="127" fill="#fbbf24" font-size="8" text-anchor="middle">zero-shot object detection</text>
        <text x="250" y="150" fill="#cbd5e1" font-size="8" text-anchor="middle">grounding-dino-base</text>
        <text x="250" y="164" fill="#cbd5e1" font-size="8" text-anchor="middle">prompts: "excavator."</text>
        <text x="250" y="176" fill="#cbd5e1" font-size="8" text-anchor="middle">"dump truck." "truck."</text>
        <text x="250" y="194" fill="#cbd5e1" font-size="8" text-anchor="middle">1 Hz · box thr 0.35</text>
        <text x="250" y="212" fill="#cbd5e1" font-size="8" text-anchor="middle">seeds + audits SAM 2</text>

        <!-- SAM 2.1 -->
        <rect x="380" y="90" width="200" height="205" rx="6" fill="#0f172a"/>
        <rect x="380" y="90" width="200" height="205" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="480" y="112" fill="white" font-size="12" font-weight="700" text-anchor="middle">SAM 2.1</text>
        <text x="480" y="127" fill="#fbbf24" font-size="8" text-anchor="middle">promptable video segmentation</text>
        <text x="480" y="150" fill="#cbd5e1" font-size="8" text-anchor="middle">sam2.1-hiera-tiny · 10 Hz</text>
        <text x="480" y="168" fill="#e2e8f0" font-size="8" font-weight="600" text-anchor="middle">excavator</text>
        <text x="480" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">box prompt + negative points</text>
        <text x="480" y="192" fill="#cbd5e1" font-size="8" text-anchor="middle">in the truck box</text>

        <text x="480" y="246" fill="#cbd5e1" font-size="8" text-anchor="middle">reseed if lost ≥ 1 s</text>
        <text x="480" y="268" fill="#64748b" font-size="7" text-anchor="middle">streamed fwd + bwd from seed,</text>

        <!-- Features -->
        <rect x="620" y="90" width="190" height="205" rx="6" fill="#0f172a"/>
        <rect x="620" y="90" width="190" height="205" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="715" y="112" fill="white" font-size="12" font-weight="700" text-anchor="middle">Kinematic features</text>
        <text x="715" y="127" fill="#34d399" font-size="8" text-anchor="middle">bucket box, 10 Hz</text>
        <text x="715" y="150" fill="#e2e8f0" font-size="8" font-weight="600" text-anchor="middle">scene, from the masks</text>
        <text x="715" y="162" fill="#cbd5e1" font-size="8" text-anchor="middle">slew centre · reach L</text>
        <text x="715" y="174" fill="#cbd5e1" font-size="8" text-anchor="middle">cabin · truck · pile</text>
        <text x="715" y="192" fill="#e2e8f0" font-size="8" font-weight="600" text-anchor="middle">signals</text>
        <text x="715" y="204" fill="#cbd5e1" font-size="8" text-anchor="middle">height, dh/dt · 2-D speed</text>
        <text x="715" y="216" fill="#cbd5e1" font-size="8" text-anchor="middle">pile→truck position + rate</text>
        <text x="715" y="228" fill="#cbd5e1" font-size="8" text-anchor="middle">aspect ratio (tipping)</text>
        <text x="715" y="240" fill="#cbd5e1" font-size="8" text-anchor="middle">truck overlap</text>
        <text x="715" y="268" fill="#64748b" font-size="7" text-anchor="middle">units: L and L/s · derivatives:</text>
        <text x="715" y="280" fill="#64748b" font-size="7" text-anchor="middle">Savitzky–Golay over 0.9 s</text>

        <!-- State machine -->
        <rect x="850" y="90" width="200" height="205" rx="6" fill="#0f172a"/>
        <rect x="850" y="90" width="200" height="205" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="950" y="112" fill="white" font-size="12" font-weight="700" text-anchor="middle">Phase state machine</text>
        <text x="950" y="127" fill="#22d3ee" font-size="8" text-anchor="middle">rule-based · label-free</text>
        <text x="950" y="150" fill="#cbd5e1" font-size="8" text-anchor="middle">dig → haul → dump → swing</text>
        <text x="950" y="162" fill="#cbd5e1" font-size="8" text-anchor="middle">each searched after the last</text>
        <text x="950" y="180" fill="#e2e8f0" font-size="8" font-weight="600" text-anchor="middle">pass 1 · window</text>
        <text x="950" y="192" fill="#cbd5e1" font-size="8" text-anchor="middle">physical gates (veto) →</text>
        <text x="950" y="204" fill="#cbd5e1" font-size="8" text-anchor="middle">weighted cue vote, &gt; half</text>
        <text x="950" y="222" fill="#e2e8f0" font-size="8" font-weight="600" text-anchor="middle">pass 2 · onset frame</text>
        <text x="950" y="234" fill="#cbd5e1" font-size="8" text-anchor="middle">walk back from the fastest</text>
        <text x="950" y="246" fill="#cbd5e1" font-size="8" text-anchor="middle">motion to 3σ of noise</text>
        <text x="950" y="268" fill="#fbbf24" font-size="7" text-anchor="middle">draft: eval/ → src/ port pending</text>
        <text x="950" y="280" fill="#64748b" font-size="7" text-anchor="middle">no VLM · no trained classifier</text>

        <!-- Cycles -->
        <rect x="1090" y="90" width="170" height="205" rx="6" fill="#0f172a"/>
        <rect x="1090" y="90" width="170" height="205" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="1175" y="112" fill="white" font-size="12" font-weight="700" text-anchor="middle">Cycle assembly</text>

        <text x="1175" y="150" fill="#cbd5e1" font-size="8" text-anchor="middle">phase = next onset − onset</text>
        <text x="1175" y="162" fill="#cbd5e1" font-size="8" text-anchor="middle">cycle = dig(k+1) − dig(k)</text>
        <text x="1175" y="180" fill="#cbd5e1" font-size="8" text-anchor="middle">complete cycles only:</text>
        <text x="1175" y="192" fill="#cbd5e1" font-size="8" text-anchor="middle">all 4 phases + closing dig</text>

        <!-- outputs -->

        <rect x="1110" y="340" width="150" height="80" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="1185" y="362" fill="white" font-size="11" font-weight="600" text-anchor="middle">Outputs</text>
        <text x="1185" y="380" fill="#cbd5e1" font-size="8" text-anchor="middle">answer.json</text>
        <text x="1185" y="393" fill="#cbd5e1" font-size="8" text-anchor="middle">annotated.mp4</text>
        <text x="1185" y="406" fill="#94a3b8" font-size="7" text-anchor="middle">+ features.png, run.json</text>

        <!-- eval firewall -->
        <rect x="620" y="360" width="440" height="62" rx="8" fill="transparent" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>

      </svg>

    <p class="footer">
      Detailed architecture: docs/architecture-pipeline.html · state machine: docs/state-machine-windows.html
    </p>
  </div>

  <script>
    async function copyAsImage(btn) {
      const orig = btn.textContent;
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        btn.textContent = '✓ Copied!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }

    async function downloadPNG(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const link = document.createElement('a');
        link.download = 'architecture-overview.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.textContent = '✓ Done!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }

    async function downloadPDF(btn) {
      const orig = btn.textContent;
      btn.textContent = '⏳ ...';
      try {
        const el = document.getElementById('report-container');
        const r = el.getBoundingClientRect();
        const pad = 32;
        const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait';
        const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], hotfixes: ['px_scaling'] });
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save('architecture-overview.pdf');
        btn.textContent = '✓ Done!';
      } catch (e) {
        btn.textContent = '✗ Failed';
      }
      setTimeout(() => btn.textContent = orig, 2000);
    }
  </script>
</body>
</html>
