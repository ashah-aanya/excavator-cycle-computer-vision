[project]
name = "excavator-cycles"
version = "0.1.0"
description = "Measure excavator work-cycle phase durations from video with a rule-based CV pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Core dependencies: everything needed for video I/O, geometry, features and the
# state machine. Deliberately light -- no deep-learning stack here, so the parts
# of the pipeline that run after perception stay installable and fast anywhere.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",  # headless: no GUI windows, we write files
    "pyyaml>=6.0",
    "scipy>=1.11",                   # zero-phase filtering, clustering
    "matplotlib>=3.8",               # diagnostic plots; this stage's gate is visual
]

[project.optional-dependencies]
# The perception stage. Split out so `uv sync` stays fast while working on
# stages that read the cache instead of running models.
models = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
    "accelerate>=0.30",
    "timm>=1.0",
]

[project.scripts]
excavator-cycles = "excavator_cycles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excavator_cycles"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Model-dependent tests are opt-in: they need ~700 MB of weights, so CI and the
# normal `pytest` run stay fast and offline. Run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: runs a real model; needs `uv sync --extra models` and a download",
]

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modern syntax, B bugbears,
# SIM simplifications, RUF ruff-specific. ANN/D are deliberately off: this is a
# research pipeline, and the docstring discipline here is about explaining WHY,
# which a linter cannot check.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
