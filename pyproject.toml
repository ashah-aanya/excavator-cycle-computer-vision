[project]
name = "excavator-cycles"
version = "0.1.0"
description = "Measure excavator work-cycle phase durations from video with a rule-based CV pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Everything the pipeline needs, from one plain `uv sync`: video I/O, geometry, features
# and the phase search, plus the perception stack (torch, transformers) that tracking
# runs on. Only tracking needs a GPU; every later stage reads its cache.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",  # headless: no GUI windows, we write files
    "pyyaml>=6.0",
    "scipy>=1.11",                   # zero-phase filtering, clustering
    "matplotlib>=3.8",               # diagnostic plots; this stage's gate is visual
    "av>=12",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
    "accelerate>=0.30",
    "timm>=1.0",
]

[project.scripts]
excavator-cycles = "excavator_cycles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excavator_cycles"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Model-dependent tests are opt-in: they need ~700 MB of weights, so CI and the
# normal `pytest` run stay fast and offline. Run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: runs a real model; needs a weights download",
]

[tool.ruff]
line-length = 95
src = ["src", "tests"]
# Recovered scratchpad code, kept verbatim as the record of what was verified.
# Reformatting it would make it stop matching the transcript it came from.
extend-exclude = ["reference/"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modern syntax, B bugbears,
# SIM simplifications, RUF ruff-specific. ANN/D are deliberately off: this is a
# research pipeline, and the docstring discipline here is about explaining WHY,
# which a linter cannot check.
# ARG earns its place: `render(reference=...)` was added, threaded down two
# levels, and never used -- the ground truth silently never appeared on the
# video, and nothing noticed until it was looked for with a pixel count.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ARG"]  # fixtures legitimately take unused arguments

# PyTorch's CUDA 12.8 builds on Linux. They run on any driver that supports CUDA 12.8 or
# newer, which covers the NCSA cluster this was developed on; PyPI's default Linux build
# is CUDA 13 and needs a newer driver, so a plain `uv sync` there would run on the CPU.
# macOS has no CUDA wheels, so it keeps PyPI's build.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
